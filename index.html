<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Retrato Mágico Pakan</title>
    
    <!-- Three.js (Motor 3D) -->
    <script src="https://unpkg.com/three@0.150.0/build/three.min.js"></script>
    <!-- MindAR (Cerebro de Realidad Aumentada) -->
    <script src="https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
        #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 18px; text-align: center; z-index: 100; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; width: 80%; }
        #startBtn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; font-size: 20px; background: #4CAF50; color: white; border: none; border-radius: 10px; cursor: pointer; z-index: 101; }
    </style>
</head>
<body>
    <div id="status">Presiona el botón para iniciar</div>
    <button id="startBtn">📷 Iniciar Cámara AR</button>

    <script>
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');

        startBtn.addEventListener('click', async () => {
            try {
                statusDiv.textContent = 'Iniciando...';
                startBtn.style.display = 'none';

                // Verificar que las librerías cargaron
                if (typeof THREE === 'undefined') {
                    throw new Error('Three.js no se cargó.');
                }
                if (typeof window.MINDAR === 'undefined') {
                    throw new Error('MindAR no se cargó.');
                }
                statusDiv.textContent = '✓ Librerías listas. Cargando target...';

                // 1. Iniciar MindAR
                const mindarThree = new window.MINDAR.IMAGE.MindARThree({
                    container: document.body,
                    imageTargetSrc: './targets.mind',
                });

                // 2. Cargar target
                await mindarThree.compiler.loadImageTarget();
                statusDiv.textContent = '✓ Target listo. Preparando video...';

                const { renderer, scene, camera } = mindarThree;

                // 3. Preparar el Video
                const video = document.createElement('video');
                video.src = './video-magico.mp4';
                video.loop = true;
                video.muted = true; 
                video.playsInline = true;
                video.crossOrigin = "anonymous";
                
                // Intentar reproducir para desbloquear en móviles
                await video.play();
                video.pause(); 
                video.currentTime = 0;
                
                statusDiv.textContent = '✓ Video listo. Abriendo cámara...';

                const texture = new THREE.VideoTexture(video);
                const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 0.9 });
                const geometry = new THREE.PlaneGeometry(1, 1.33); 
                const plane = new THREE.Mesh(geometry, material);

                // 4. Unir el video al Target
                const anchor = mindarThree.addAnchor(0);
                anchor.group.add(plane);

                // 5. Iniciar la cámara
                await mindarThree.start();
                statusDiv.style.display = 'none';

                renderer.setAnimationLoop(() => {
                    renderer.render(scene, camera);
                });

                // Reproducir cuando se encuentre el retrato
                mindarThree.onTargetFound = () => {
                    video.play();
                };
                mindarThree.onTargetLost = () => {
                    video.pause();
                };

            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = `
                    <div style="color: #ff6b6b;">❌ Error</div>
                    <div style="font-size: 14px; margin-top: 10px;">${error.message}</div>
                    <div style="font-size: 12px; margin-top: 15px; color: #aaa;">
                        Revisa que los archivos targets.mind y video-magico.mp4 estén en la misma carpeta que el index.html
                    </div>
                `;
                startBtn.style.display = 'block';
                startBtn.textContent = '🔄 Reintentar';
            }
        });
    </script>
</body>
</html>
