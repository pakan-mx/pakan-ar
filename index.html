<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Retrato Mágico Pakan</title>
    
    <!-- Cargamos las librerías desde TU propio repositorio -->
    <script src="./three.min.js"></script>
    <script src="./mindar-image-three.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
        #status { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            color: white; 
            font-size: 16px; 
            text-align: center; 
            z-index: 100; 
            background: rgba(0,0,0,0.9); 
            padding: 20px; 
            border-radius: 10px; 
            width: 85%;
            max-width: 400px;
        }
        #startBtn { 
            position: absolute; 
            top: 65%; 
            left: 50%; 
            transform: translateX(-50%); 
            padding: 15px 30px; 
            font-size: 18px; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            z-index: 101; 
        }
        .error { color: #ff6b6b; }
        .success { color: #4CAF50; }
    </style>
</head>
<body>
    <div id="status">
        <div>🔍 Verificando librerías...</div>
        <div id="details" style="font-size: 12px; margin-top: 10px; color: #aaa;"></div>
    </div>
    <button id="startBtn" style="display: none;">📷 Iniciar Cámara AR</button>

    <script>
        const statusDiv = document.getElementById('status');
        const detailsDiv = document.getElementById('details');
        const startBtn = document.getElementById('startBtn');

        window.addEventListener('load', () => {
            let status = '';
            
            if (typeof THREE !== 'undefined') {
                status += '✓ Three.js cargado<br>';
            } else {
                status += '<span class="error"> Three.js NO cargó</span><br>';
            }
            
            if (typeof window.MINDAR !== 'undefined') {
                status += '✓ MindAR cargado<br>';
            } else {
                status += '<span class="error">✗ MindAR NO cargó</span><br>';
            }
            
            detailsDiv.innerHTML = status;
            
            if (typeof THREE !== 'undefined' && typeof window.MINDAR !== 'undefined') {
                statusDiv.innerHTML = '<div class="success">✓ Todo listo</div><div style="font-size: 14px; margin-top: 10px;">Presiona el botón para iniciar</div>';
                startBtn.style.display = 'block';
            } else {
                statusDiv.innerHTML = `
                    <div class="error">❌ Las librerías no cargaron</div>
                    <div style="font-size: 12px; margin-top: 10px;">${status}</div>
                `;
            }
        });

        startBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerHTML = '<div>Iniciando cámara...</div>';
                startBtn.style.display = 'none';

                const mindarThree = new window.MINDAR.IMAGE.MindARThree({
                    container: document.body,
                    imageTargetSrc: './targets.mind',
                });

                statusDiv.innerHTML = '<div>Cargando target...</div>';
                await mindarThree.compiler.loadImageTarget();

                const { renderer, scene, camera } = mindarThree;

                const video = document.createElement('video');
                video.src = './video-magico.mp4';
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.crossOrigin = "anonymous";
                
                await video.play();
                video.pause();
                video.currentTime = 0;

                const texture = new THREE.VideoTexture(video);
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    transparent: true, 
                    opacity: 0.9 
                });
                const geometry = new THREE.PlaneGeometry(1, 1.33);
                const plane = new THREE.Mesh(geometry, material);

                const anchor = mindarThree.addAnchor(0);
                anchor.group.add(plane);

                statusDiv.innerHTML = '<div>Abriendo cámara...</div>';
                await mindarThree.start();
                statusDiv.style.display = 'none';

                renderer.setAnimationLoop(() => {
                    renderer.render(scene, camera);
                });

                mindarThree.onTargetFound = () => video.play();
                mindarThree.onTargetLost = () => video.pause();

            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = `
                    <div class="error">❌ Error: ${error.message}</div>
                `;
                startBtn.style.display = 'block';
                startBtn.textContent = ' Reintentar';
            }
        });
    </script>
</body>
</html>
