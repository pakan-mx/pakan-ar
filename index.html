<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retrato AR - Pakan</title>
  
  <!-- Three.js para 3D -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
  
  <!-- MindAR para reconocimiento de imagen -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.3/dist/mindar-image-three.prod.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      z-index: 1000;
    }
    
    #loading.hidden {
      display: none;
    }
    
    #instructions {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 15px 25px;
      border-radius: 10px;
      text-align: center;
      z-index: 100;
    }
    
    #instructions.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div>Cargando experiencia AR...</div>
    <div style="font-size: 16px; margin-top: 10px;">Por favor espera</div>
  </div>
  
  <div id="instructions">
    Apunta tu cámara al retrato
  </div>

  <script>
    const startAR = async () => {
      try {
        // Inicializar MindAR
        const mindarThree = new window.MindAR.Image.MindARThree({
          container: document.body,
          imageTargetSrc: 'retrato-target.mind',
          uiLoading: 'no',
          uiError: 'no',
          filterMinCF: 0.001,
          filterBeta: 10,
        });

        // Cargar el target (el archivo .mind)
        await mindarThree.compiler.loadImageTarget();

        const { renderer, scene, camera } = mindarThree;

        // Crear anchor para el retrato (target 0)
        const anchor = mindarThree.addAnchor(0);

        // Crear video
        const video = document.createElement('video');
        video.src = 'video-magico.mp4';
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.crossOrigin = "anonymous";
        
        // Esperar a que el video esté listo
        await new Promise((resolve) => {
          video.onloadeddata = resolve;
          video.load();
        });

        // Crear textura de video
        const videoTexture = new THREE.VideoTexture(video);
        const videoMaterial = new THREE.MeshBasicMaterial({ 
          map: videoTexture, 
          transparent: true,
          opacity: 0.95
        });
        
        // Geometría del plano (ajusta el tamaño según tu retrato)
        // Si tu retrato es vertical, usa (1, 1.4)
        // Si es horizontal, usa (1.4, 1)
        const videoGeometry = new THREE.PlaneGeometry(1, 1.4);
        const videoMesh = new THREE.Mesh(videoGeometry, videoMaterial);
        videoMesh.position.set(0, 0, 0.01); // Ligeramente delante del retrato

        // Agregar el video al anchor
        anchor.group.add(videoMesh);

        // Iniciar el tracking
        await mindarThree.start();
        
        // Ocultar el loading
        document.getElementById('loading').classList.add('hidden');

        // Loop de renderizado
        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

        // Cuando se encuentra el retrato
        mindarThree.onTargetFound = () => {
          console.log('¡Retrato detectado!');
          video.play();
          document.getElementById('instructions').classList.add('hidden');
        };

        // Cuando se pierde el retrato
        mindarThree.onTargetLost = () => {
          console.log('Retrato perdido');
          video.pause();
          document.getElementById('instructions').classList.remove('hidden');
        };

      } catch (error) {
        console.error('Error iniciando AR:', error);
        document.getElementById('loading').innerHTML = `
          <div>Error al cargar la experiencia AR</div>
          <div style="font-size: 14px; margin-top: 10px;">${error.message}</div>
        `;
      }
    };

    // Iniciar cuando la página cargue
    window.addEventListener('load', startAR);
  </script>
</body>
</html>
