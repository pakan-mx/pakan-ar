<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retrato Mágico Pakan</title>
    <!-- Librerías necesarias (Three.js y MindAR) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.150.0/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.3/dist/mindar-image-three.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #overlay { position: absolute; top: 10px; left: 0; width: 100%; text-align: center; color: white; font-family: sans-serif; z-index: 10; pointer-events: none;}
    </style>
</head>
<body>
    <div id="overlay">Apunta la cámara al retrato</div>

    <script>
        const start = async () => {
            // 1. Iniciar MindAR
            const mindarThree = new window.MINDAR.IMAGE.MindARThree({
                container: document.body,
                imageTargetSrc: './targets.mind', // Aquí llama al Target
                uiScanning: '#overlay',
            });

            const { renderer, scene, camera } = mindarThree;

            // 2. Preparar el Video
            const video = document.createElement('video');
            video.src = './video-magico.mp4'; // Aquí llama a tu video
            video.loop = true;
            video.muted = true; // Necesario para que autoplay funcione en móviles
            video.playsInline = true;
            video.crossOrigin = "anonymous";
            await video.play();

            const texture = new THREE.VideoTexture(video);
            const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 0.9 });
            
            // Ajusta el tamaño del video (ancho, alto) según la forma de tu retrato
            const geometry = new THREE.PlaneGeometry(1, 1.33); 
            const plane = new THREE.Mesh(geometry, material);
            plane.position.set(0, 0, 0);

            // 3. Unir el video al Target (posición 0)
            const anchor = mindarThree.addAnchor(0);
            anchor.group.add(plane);

            // 4. Iniciar la cámara
            await mindarThree.start();
            renderer.setAnimationLoop(() => {
                renderer.render(scene, camera);
            });
        };

        window.addEventListener('load', start);
    </script>
</body>
</html>
