<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retrato AR - Pakan</title>
  
  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
  
  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.3/dist/mindar-image-three.prod.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 1000;
      text-align: center;
      padding: 20px;
    }
    
    #loading.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div>Cargando experiencia AR...</div>
    <div style="font-size: 14px; margin-top: 10px; color: #888;">Por favor espera</div>
  </div>

  <script>
    const startAR = async () => {
      try {
        // Verificar que MindAR esté cargado
        if (typeof window.MINDAR === 'undefined') {
          throw new Error('MindAR no se cargó correctamente');
        }

        // Inicializar MindAR con la forma correcta
        const mindarThree = new window.MINDAR.IMAGE.MindARThree({
          container: document.body,
          imageTargetSrc: 'retrato-target.mind',
          uiLoading: 'no',
          uiError: 'no',
        });

        // Cargar el target
        await mindarThree.compiler.loadImageTarget();

        const { renderer, scene, camera } = mindarThree;

        // Crear anchor
        const anchor = mindarThree.addAnchor(0);

        // Crear video
        const video = document.createElement('video');
        video.src = 'video-magico.mp4';
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.crossOrigin = "anonymous";
        
        // Esperar a que el video cargue
        await new Promise((resolve) => {
          video.onloadeddata = resolve;
          video.load();
        });

        // Crear textura de video
        const videoTexture = new THREE.VideoTexture(video);
        const videoMaterial = new THREE.MeshBasicMaterial({ 
          map: videoTexture, 
          transparent: true,
          opacity: 0.95
        });
        
        // Geometría
        const videoGeometry = new THREE.PlaneGeometry(1, 1.4);
        const videoMesh = new THREE.Mesh(videoGeometry, videoMaterial);
        videoMesh.position.set(0, 0, 0.01);

        anchor.group.add(videoMesh);

        // Iniciar
        await mindarThree.start();
        
        // Ocultar loading
        document.getElementById('loading').classList.add('hidden');

        // Loop
        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

        // Eventos
        mindarThree.onTargetFound = () => {
          console.log('Retrato detectado');
          video.play();
        };

        mindarThree.onTargetLost = () => {
          console.log('Retrato perdido');
          video.pause();
        };

      } catch (error) {
        console.error('Error completo:', error);
        document.getElementById('loading').innerHTML = `
          <div style="color: #ff6b6b;">Error al cargar AR</div>
          <div style="font-size: 14px; margin-top: 10px; color: #888;">
            ${error.message}
          </div>
          <div style="font-size: 12px; margin-top: 20px; color: #666;">
            Verifica que los archivos estén subidos correctamente
          </div>
        `;
      }
    };

    window.addEventListener('load', startAR);
  </script>
</body>
</html>
